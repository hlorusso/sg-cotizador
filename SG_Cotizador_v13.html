<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SG Impresiones · Cotizá tu pedido</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --cyan:#00A8E8;
  --cyan-dark:#0088C2;
  --cyan-light:#E0F5FD;
  --cyan-bg:#F0FAFF;
  --yellow:#FFE600;
  --yellow-dark:#E6CE00;
  --dark:#111827;
  --sub:#4B6B7A;
  --border:#B8DFF0;
  --card:#fff;
  --wa:#25D366;
  --green:#1E7A3E;
}
html{background:var(--cyan-bg)}
body{
  font-family:'Barlow',system-ui,-apple-system,sans-serif;
  background:var(--cyan-bg);color:var(--dark);
  min-height:100vh;max-width:480px;margin:0 auto
}

/* ── Header ── */
.hdr{background:var(--cyan);color:#fff;padding:14px 16px 0;position:sticky;top:0;z-index:20;
  box-shadow:0 2px 12px rgba(0,168,232,.35)}
.hdr-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.hdr-logo{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:20px;letter-spacing:.5px;
  text-transform:uppercase;flex:1;display:flex;align-items:center;gap:0}
.hdr-top .step-lbl{font-size:11px;opacity:.85;white-space:nowrap;background:rgba(0,0,0,.15);
  padding:3px 8px;border-radius:20px;font-weight:600;letter-spacing:.3px}
.back{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;padding:4px 6px;border-radius:6px;line-height:1}
.back:hover{background:rgba(0,0,0,.15)}
.prog{height:4px;background:rgba(0,0,0,.2);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:var(--yellow);border-radius:2px;transition:width .35s ease}

/* ── Content ── */
.content{padding:20px 16px 40px}

/* ── Question ── */
.q-icon{font-size:36px;margin-bottom:8px;display:block}
.q-title{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:800;
  color:var(--dark);line-height:1.15;margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px}
.q-sub{font-size:13px;color:var(--sub);margin-bottom:20px;font-weight:500}

/* ── Supercategory grid ── */
.supercat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.supercat-btn{
  background:var(--card);border:2px solid var(--border);border-radius:16px;
  padding:0;cursor:pointer;font-family:'Barlow',sans-serif;
  transition:all .15s;display:flex;flex-direction:column;overflow:hidden;
  min-height:120px;text-align:left
}
.supercat-btn .sc-img{
  width:100%;height:72px;object-fit:cover;display:block;background:#dde8ee;flex-shrink:0
}
.supercat-btn .sc-label{
  padding:10px 12px 12px;flex:1;display:flex;flex-direction:column;justify-content:center
}
.supercat-btn .sc-name{font-size:13px;font-weight:800;color:var(--dark);line-height:1.2;
  font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.3px}
.supercat-btn .sc-count{font-size:11px;color:var(--sub);font-weight:500;margin-top:2px}
.supercat-btn:hover,.supercat-btn:active{border-color:var(--cyan);background:var(--cyan-light)}
.supercat-btn:hover .sc-name,.supercat-btn:active .sc-name{color:var(--cyan-dark)}

/* ── Product grid ── */
.prod-grid{display:flex;flex-direction:column;gap:9px}
.prod-btn{
  background:var(--card);border:2px solid var(--border);border-radius:14px;
  padding:0;text-align:left;cursor:pointer;
  font-size:14px;font-weight:700;color:var(--dark);font-family:'Barlow',sans-serif;
  transition:all .15s;display:flex;flex-direction:row;align-items:center;gap:0;
  min-height:72px;overflow:hidden;line-height:1.3
}
.prod-btn .prod-img{
  width:88px;min-width:88px;height:72px;object-fit:cover;
  border-radius:11px 0 0 11px;display:block;background:#dde8ee;flex-shrink:0
}
.prod-btn .prod-label{
  flex:1;padding:12px 14px;display:flex;flex-direction:column;gap:2px
}
.prod-btn .prod-name{font-size:14px;font-weight:700;color:var(--dark);line-height:1.25}
.prod-btn .prod-cat{font-size:11px;font-weight:500;color:var(--sub);text-transform:uppercase;letter-spacing:.4px}
.prod-btn .prod-arrow{color:var(--border);font-size:18px;padding-right:14px;flex-shrink:0;font-weight:300}
.prod-btn:hover,.prod-btn:active{border-color:var(--cyan);background:var(--cyan-light)}
.prod-btn:hover .prod-name,.prod-btn:active .prod-name{color:var(--cyan-dark)}
.prod-btn:hover .prod-arrow,.prod-btn:active .prod-arrow{color:var(--cyan)}

/* ── Option list ── */
.opts{display:flex;flex-direction:column;gap:9px}
.opt-btn{
  background:var(--card);border:2px solid var(--border);border-radius:12px;
  padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:12px;
  font-size:14px;font-weight:600;color:var(--dark);transition:all .15s;text-align:left;
  font-family:'Barlow',sans-serif
}
.opt-btn .opt-txt{flex:1;line-height:1.3}
.opt-btn .opt-sub{font-size:11.5px;color:var(--sub);font-weight:400;margin-top:3px;display:block;line-height:1.35}
.opt-btn .opt-code{font-size:10px;color:var(--sub);font-weight:700;font-family:monospace;
  background:#E8F4FB;border-radius:4px;padding:1px 6px;margin-left:7px;vertical-align:middle;
  letter-spacing:.5px;border:1px solid var(--border)}
.opt-btn .chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--border);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .15s}
.opt-btn:hover,.opt-btn:active{border-color:var(--cyan);background:var(--cyan-light)}
.opt-btn.sel{border-color:var(--cyan);background:var(--cyan-light);color:var(--cyan-dark)}
.opt-btn.sel .chk{background:var(--cyan);border-color:var(--cyan);color:#fff}

/* ── Cantidad chips ── */
.qty-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:4px}
.qty-btn{
  background:var(--card);border:2px solid var(--border);border-radius:10px;
  padding:12px 8px;text-align:center;cursor:pointer;
  font-size:14px;font-weight:700;color:var(--dark);transition:all .15s;
  font-family:'Barlow Condensed',sans-serif;letter-spacing:.3px
}
.qty-btn:hover,.qty-btn:active{border-color:var(--cyan);background:var(--cyan-light)}
.qty-btn.sel{border-color:var(--cyan);background:var(--cyan-light);color:var(--cyan-dark)}

/* ── Input libre ── */
.free-input-row{display:flex;gap:8px;margin-top:8px;align-items:center}
.free-input-row input{
  flex:1;border:2px solid var(--border);border-radius:10px;
  padding:12px 14px;font-size:15px;color:var(--dark);background:var(--card);outline:none;
  font-family:'Barlow',sans-serif
}
.free-input-row input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,168,232,.12)}
.free-input-row .btn-confirm{
  background:var(--cyan);color:#fff;border:none;border-radius:10px;
  padding:12px 18px;font-size:14px;font-weight:700;cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;white-space:nowrap
}

/* ── Dimensiones (ancho x alto) ── */
.dims-row{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-bottom:8px}
.dims-row .dim-sep{font-size:18px;color:var(--sub);text-align:center;font-weight:700}
.dims-row input{
  border:2px solid var(--border);border-radius:10px;
  padding:12px 14px;font-size:15px;color:var(--dark);background:var(--card);outline:none;
  font-family:'Barlow',sans-serif;text-align:center;width:100%
}
.dims-row input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,168,232,.12)}

/* ── Extra info form ── */
.field{margin-bottom:18px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--sub);
  text-transform:uppercase;letter-spacing:.6px;margin-bottom:7px;font-family:'Barlow Condensed',sans-serif}
.field input,.field select{
  width:100%;border:2px solid var(--border);border-radius:10px;
  padding:13px 14px;font-size:15px;color:var(--dark);background:var(--card);outline:none;
  font-family:'Barlow',sans-serif;appearance:none
}
.field input:focus,.field select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,168,232,.12)}
.yn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.yn-btn{
  background:var(--card);border:2px solid var(--border);border-radius:10px;
  padding:13px;text-align:center;cursor:pointer;font-size:13.5px;font-weight:700;
  color:var(--dark);transition:all .15s;font-family:'Barlow',sans-serif
}
.yn-btn:hover{border-color:var(--cyan);background:var(--cyan-light)}
.yn-btn.sel{border-color:var(--green);background:#E8F5EE;color:var(--green)}

/* ── Summary ── */
.sum-card{background:var(--card);border-radius:16px;padding:20px;border:2px solid var(--border);margin-bottom:14px}
.sum-rows{display:flex;flex-direction:column;gap:0}
.sum-row{display:flex;justify-content:space-between;align-items:flex-start;
  padding:9px 0;border-bottom:1px solid var(--border);gap:12px}
.sum-row:last-child{border-bottom:none;padding-bottom:0}
.sum-k{font-size:12.5px;color:var(--sub);font-weight:600;min-width:110px}
.sum-v{font-size:13.5px;font-weight:700;text-align:right;color:var(--dark);flex:1}
.sum-note{font-size:12px;color:var(--sub);text-align:center;margin-bottom:6px}
.sum-header{background:var(--cyan);border-radius:12px;padding:16px 20px;margin-bottom:14px;
  display:flex;align-items:center;gap:14px}
.sum-header .sh-icon{font-size:32px}
.sum-header .sh-prod{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:900;
  color:#fff;text-transform:uppercase;letter-spacing:.5px}
.sum-header .sh-sub{font-size:12px;color:rgba(255,255,255,.8);font-weight:500}

/* ── Arte info box ── */
.arte-box{background:#FFFBEA;border:2px solid var(--yellow-dark);border-radius:14px;padding:16px;margin-top:12px}
.arte-box-title{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:16px;color:#7A5800;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.arte-formats{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.arte-fmt{display:flex;align-items:flex-start;gap:10px;background:#fff;border-radius:10px;padding:10px 12px;border:1px solid #FFD966}
.arte-fmt-tag{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:14px;background:var(--dark);color:#fff;border-radius:6px;padding:2px 8px;white-space:nowrap;flex-shrink:0}
.arte-fmt-tag.best{background:var(--cyan)}
.arte-fmt-txt{font-size:13px;color:var(--dark);line-height:1.45}
.arte-fmt-txt strong{font-weight:700}
.dpi-box{background:var(--cyan-light);border-radius:10px;padding:10px 12px;font-size:12.5px;color:#005070;line-height:1.6}
.dpi-box strong{font-weight:700}

/* ── Buttons ── */
.btn-primary{
  background:var(--cyan);color:#fff;border:none;border-radius:12px;
  padding:16px;width:100%;font-size:16px;font-weight:800;cursor:pointer;
  margin-top:20px;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;
  letter-spacing:.8px;transition:background .15s
}
.btn-primary:hover{background:var(--cyan-dark)}
.btn-primary:disabled{background:#aaa;cursor:not-allowed}
.btn-wa{
  background:var(--wa);color:#fff;border:none;border-radius:12px;
  padding:16px;width:100%;font-size:16px;font-weight:800;cursor:pointer;
  margin-top:12px;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;
  letter-spacing:.8px;display:flex;align-items:center;justify-content:center;gap:8px;
  text-decoration:none;transition:background .15s
}
.btn-wa:hover{background:#1eba56}
.btn-human{
  background:transparent;color:var(--cyan-dark);border:2px solid var(--cyan);
  border-radius:12px;padding:13px;width:100%;font-size:14px;font-weight:700;cursor:pointer;
  margin-top:8px;font-family:'Barlow',sans-serif;display:flex;align-items:center;
  justify-content:center;gap:8px;text-decoration:none;transition:all .15s
}
.btn-human:hover{background:var(--cyan-light)}

/* ── Welcome ── */
.welcome{background:var(--cyan);min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:40px 24px;text-align:center;position:relative;overflow:hidden}

  background-repeat:no-repeat;background-size:contain;
  width:420px;height:170px;top:-20px;right:-60px;opacity:0.15;
  user-select:none;pointer-events:none}
.welcome-logo{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:22px;
  color:rgba(255,255,255,.9);text-transform:uppercase;letter-spacing:1px;margin-bottom:40px;
  display:flex;align-items:center;gap:10px}
.welcome-logo .sg-box{background:var(--yellow);color:var(--dark);padding:4px 12px;border-radius:6px;font-size:24px}
.welcome h2{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:48px;
  color:#fff;text-transform:uppercase;letter-spacing:.5px;line-height:1.05;margin-bottom:8px}
.welcome h2 .hl{background:var(--yellow);color:var(--dark);padding:0 8px;display:inline-block;
  border-radius:4px;margin-top:4px}
.welcome p{color:rgba(255,255,255,.85);font-size:15px;line-height:1.5;margin-bottom:36px;max-width:300px}
.btn-start{
  background:var(--yellow);color:var(--dark);border:none;border-radius:14px;
  padding:18px 36px;font-size:18px;font-weight:900;cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:1px;
  display:inline-flex;align-items:center;gap:10px;box-shadow:0 4px 20px rgba(0,0,0,.2)
}
.btn-start:hover{background:var(--yellow-dark)}
.footer-note{font-size:12.5px;color:rgba(255,255,255,.7);text-align:center;margin-top:18px;line-height:1.6}
.footer-note a{color:#fff;font-weight:700;text-decoration:none}

/* ── Animation ── */
.fade{animation:fd .2s ease}
@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.scroll-hint{font-size:12px;color:var(--sub);text-align:center;padding:8px 0 0}

/* ── Info box ── */
.info-box{background:var(--cyan-light);border:1.5px solid var(--border);border-radius:12px;
  padding:13px 15px;font-size:13px;color:#005070;line-height:1.55;margin-bottom:16px}
.info-box strong{font-weight:700}
</style>

const LOGO_SVG = `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="auto" height="24" viewBox="0 0 714.142 134.839">

function push(screen, data={}) {
  S.history.push(S.screen);
  S.screen = screen;
  Object.assign(S, data);
  render();
}

function goBack() {
  const prev = S.history.pop();
  if (!prev) { S.screen = 'welcome'; render(); return; }
  S.screen = prev;
  render();
}

function logToSheets() {
  if (!SHEETS_URL || !SHEETS_URL.startsWith('http')) return;
  const d = buildSummaryData();
  fetch(SHEETS_URL, {method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}).catch(()=>{});
}

function buildSummaryData() {
  if (S.producto === 'hojas_sueltas') {
    return {
      nombre: S.extra.nombre,
      producto: 'Hojas Sueltas',
      tintas: S.hs.color ? (TINTAS_INFO[S.hs.color]?.label || S.hs.color) : '',
      tamano: S.hs.tamaño || '',
      papel: S.hs.papel || '',
      cantidad: S.hs.cantidad === 'otra' ? S.hs.cantCustom : (S.hs.cantidad || ''),
      arte: S.extra.tieneArte === null ? '' : S.extra.tieneArte ? 'Entrega arte' : 'Necesita diseño',
      fecha: S.extra.fecha
    };
  }
  if (S.area === 'granformato') {
    const gf = S.gf;
    const tamStr = gf.tamaño === 'otra' ? `${gf.ancho}×${gf.alto} cm` : (gf.tamaño || '');
    const cant = gf.cantidad === 'otra' ? gf.cantCustom : (gf.cantidad || '');
    return {
      nombre: S.extra.nombre,
      producto: GF_SUBRUBROS.find(s=>s.id===gf.subrubro)?.name || '',
      papel: gf.papel || '',
      cobertura: gf.cobertura || '',
      tamano: tamStr,
      terminacion: gf.terminacion || '',
      color: gf.color || '',
      soporte: gf.soporte || '',
      cantidad: cant,
      arte: S.extra.tieneArte === null ? '' : S.extra.tieneArte ? 'Entrega arte' : 'Necesita diseño',
      fecha: S.extra.fecha
    };
  }
  if (S.area === 'etiquetas') {
    const et = S.et;
    const tamStr = et.tamaño === 'otra' ? `${et.ancho}×${et.alto} cm` : (et.tamaño || '');
    const cant = et.cantidad === 'otra' ? et.cantCustom : (et.cantidad || '');
    return {
      nombre: S.extra.nombre,
      producto: ET_SUBRUBROS.find(s=>s.id===et.subrubro)?.name || '',
      papel: et.papel || '', color: et.color || '',
      tamano: tamStr, laminado: et.laminado || '',
      terminacion: et.terminacion || '', cantidad: cant,
      arte: S.extra.tieneArte === null ? '' : S.extra.tieneArte ? 'Entrega arte' : 'Necesita diseño',
      fecha: S.extra.fecha
    };
  }
  return {};
}

// Genera el prefijo con ítems ya confirmados para mensajes multi-presupuesto
function buildItemsPrefix() {
  if (!S.items.length) return '';
  let prefix = '';
  S.items.forEach((item, i) => {
    prefix += `${i+1}️⃣ ${item.msg}\n\n`;
  });
  return prefix;
}

function buildWAMessage() {
  const itemsN = S.items.length + 1; // número de este ítem
  const prefix = buildItemsPrefix();
  const itemLabel = itemsN > 1 ? `${itemsN}️⃣ ` : '';

  if (S.producto === 'hojas_sueltas') {
    const hs = S.hs;
    const cant = hs.cantidad === 'otra' ? hs.cantCustom : hs.cantidad;
    let msg = `¡Hola! Quiero consultar precio para:\n\n`;
    msg += prefix;
    msg += `${itemLabel}*Producto:* Hojas Sueltas\n`;
    if (hs.color) msg += `*Color:* ${TINTAS_INFO[hs.color]?.label || hs.color} (${TINTAS_INFO[hs.color]?.code || hs.color})\n`;
    if (hs.tamaño) msg += `*Tamaño:* ${hs.tamaño}\n`;
    if (hs.papel) msg += `*Papel:* ${hs.papel}\n`;
    if (cant) msg += `*Cantidad:* ${cant} unidades\n`;
    if (S.extra.tieneArte !== null) msg += `*Arte:* ${S.extra.tieneArte ? 'Lo mando adjunto en este chat' : 'Necesito diseño'}\n`;
    if (S.extra.fecha) {
      const d = new Date(S.extra.fecha+'T12:00:00');
      msg += `*Lo necesito para:* ${d.toLocaleDateString('es-AR',{day:'numeric',month:'long'})}\n`;
    }
    if (S.extra.observaciones) msg += `*Observaciones:* ${S.extra.observaciones}\n`;
    if (S.extra.nombre) msg += `\n_Soy ${S.extra.nombre}_`;
    return msg;
  }
  if (S.area === 'granformato') {
    const gf = S.gf;
    const cant = gf.cantidad === 'otra' ? gf.cantCustom : gf.cantidad;
    const tamStr = gf.tamaño === 'otra' ? `${gf.ancho} × ${gf.alto} cm` : (gf.tamaño || '');
    const subnombre = GF_SUBRUBROS.find(s=>s.id===gf.subrubro)?.name || '';
    let msg = `¡Hola! Quiero consultar precio para:\n\n`;
    msg += prefix;
    msg += `${itemLabel}*Producto:* ${subnombre}\n`;
    if (gf.color)      msg += `*Color:* ${gf.color}\n`;
    if (gf.soporte)    msg += `*Soporte:* ${gf.soporte}\n`;
    if (gf.papel)      msg += `*Papel:* ${gf.papel}\n`;
    if (gf.cobertura)  msg += `*Cobertura de tinta:* ${gf.cobertura}\n`;
    if (tamStr)        msg += `*Tamaño:* ${tamStr}\n`;
    if (gf.terminacion) msg += `*Terminación:* ${gf.terminacion}\n`;
    if (cant)          msg += `*Cantidad:* ${cant} unidades\n`;
    if (S.extra.tieneArte !== null) msg += `*Arte:* ${S.extra.tieneArte ? 'Lo mando adjunto en este chat' : 'Necesito diseño'}\n`;
    if (S.extra.fecha) {
      const d = new Date(S.extra.fecha+'T12:00:00');
      msg += `*Lo necesito para:* ${d.toLocaleDateString('es-AR',{day:'numeric',month:'long'})}\n`;
    }
    if (S.extra.observaciones) msg += `*Observaciones:* ${S.extra.observaciones}\n`;
    if (S.extra.nombre) msg += `\n_Soy ${S.extra.nombre}_`;
    return msg;
  }
  if (S.area === 'etiquetas') {
    const et = S.et;
    const cant = et.cantidad === 'otra' ? et.cantCustom : et.cantidad;
    const tamStr = et.tamaño === 'otra' ? `${et.ancho} × ${et.alto} cm` : (et.tamaño || '');
    const subnombre = ET_SUBRUBROS.find(s=>s.id===et.subrubro)?.name || '';
    let msg = `¡Hola! Quiero consultar precio para:\n\n`;
    msg += prefix;
    msg += `${itemLabel}*Producto:* ${subnombre}\n`;
    if (et.papel)       msg += `*Papel:* ${et.papel}\n`;
    if (et.color)       msg += `*Color:* ${et.color}\n`;
    if (tamStr)         msg += `*Tamaño:* ${tamStr}\n`;
    if (et.laminado)    msg += `*Laminado:* ${et.laminado}\n`;
    if (et.terminacion) msg += `*Terminación:* ${et.terminacion}\n`;
    if (cant)           msg += `*Cantidad:* ${cant} unidades\n`;
    if (S.extra.tieneArte !== null) msg += `*Arte:* ${S.extra.tieneArte ? 'Lo mando adjunto en este chat' : 'Necesito diseño'}\n`;
    if (S.extra.fecha) {
      const d = new Date(S.extra.fecha+'T12:00:00');
      msg += `*Lo necesito para:* ${d.toLocaleDateString('es-AR',{day:'numeric',month:'long'})}\n`;
    }
    if (S.extra.observaciones) msg += `*Observaciones:* ${S.extra.observaciones}\n`;
    if (S.extra.nombre) msg += `\n_Soy ${S.extra.nombre}_`;
    return msg;
  }
  if (S.area === 'fotolibros') {
    const fl = S.fl;
    const cant = fl.cantidad === 'otra' ? fl.cantCustom : fl.cantidad;
    const pags = fl.paginas === 'extra' ? `${fl.paginasExtra} páginas` : (fl.paginas || '');
    let msg = `¡Hola! Quiero consultar precio para:\n\n`;
    msg += prefix;
    msg += `${itemLabel}*Producto:* Fotolibro Apertura 180°\n`;
    if (fl.tapa)   msg += `*Tipo de tapa:* ${fl.tapa}\n`;
    if (fl.tamaño) msg += `*Tamaño:* ${fl.tamaño}\n`;
    if (pags)      msg += `*Páginas:* ${pags}\n`;
    if (cant)      msg += `*Cantidad:* ${cant} ejemplares\n`;
    if (S.extra.tieneArte !== null) msg += `*Arte:* ${S.extra.tieneArte ? 'Lo mando adjunto en este chat' : 'Necesito diseño'}\n`;
    if (S.extra.fecha) {
      const d = new Date(S.extra.fecha+'T12:00:00');
      msg += `*Lo necesito para:* ${d.toLocaleDateString('es-AR',{day:'numeric',month:'long'})}\n`;
    }
    if (S.extra.observaciones) msg += `*Observaciones:* ${S.extra.observaciones}\n`;
    if (S.extra.nombre) msg += `\n_Soy ${S.extra.nombre}_`;
    return msg;
  }
  if (S.area === 'imprenta') {
    const im = S.im;
    const cant = im.cantidad === 'otra' ? im.cantCustom : im.cantidad;
    const prod = IM_PRODUCTOS.find(p=>p.id===im.producto)?.name || im.producto || '';
    let msg = `¡Hola! Quiero consultar precio para:\n\n`;
    msg += prefix;
    msg += `${itemLabel}*Producto:* ${prod}\n`;
    if (im.esPromoViernes) msg += `*Modalidad:* Promo Viernes\n`;
    if (im.tipoPlegado)    msg += `*Tipo:* ${im.tipoPlegado}\n`;
    if (im.tipoPapeleria)  msg += `*Tipo:* ${im.tipoPapeleria === 'hojas' ? 'Hojas membretadas' : 'Sobres'}\n`;
    if (im.tipoSobre)      msg += `*Formato sobre:* ${im.tipoSobre}\n`;
    if (im.papel)          msg += `*Papel:* ${im.papel}\n`;
    if (im.tamaño)         msg += `*Tamaño:* ${im.tamaño}\n`;
    if (im.color)          msg += `*Color:* ${im.color}\n`;
    if (im.solapa !== null) msg += `*Solapa:* ${im.solapa ? 'Con solapa' : 'Sin solapa'}\n`;
    if (im.colorSolapa)    msg += `*Color de solapa:* ${im.colorSolapa}\n`;
    if (im.laminado)       msg += `*Laminado:* ${im.laminado}\n`;
    if (im.intercalado)    msg += `*Intercalado:* ${im.intercalado}\n`;
    if (im.numeracionInicio) msg += `*Numeración desde:* ${im.numeracionInicio}\n`;
    if (im.encuadernacion) msg += `*Encuadernación:* ${im.encuadernacion}\n`;
    if (im.tieneTroquelado !== null && im.tieneTroquelado !== undefined){const tL={'no':'Sin troquelado','solo_original':'Solo original','todos':'Original + copias'};msg += `*Troquelado:* ${typeof im.tieneTroquelado==='string'?(tL[im.tieneTroquelado]||im.tieneTroquelado):(im.tieneTroquelado?'Sí':'No')}\n`;}
    if (im.tipoEncuadernado) msg += `*Encuadernado:* ${im.tipoEncuadernado}${im.tipoEncuadernadoOtro ? ` (${im.tipoEncuadernadoOtro})` : ''}\n`;
    if (im.tipoEncuadernadoInterior) msg += `*Enc. interior:* ${im.tipoEncuadernadoInterior}\n`;
    if (im.colorImp)       msg += `*Color:* ${im.colorImp}\n`;
    if (im.cantPaginas)    msg += `*${im.tipoEncuadernado==='Libretas anilladas'?'Hojas':'Páginas'}:* ${im.cantPaginas}\n`;
    if (im.papelTapa)      msg += `*Papel tapa:* ${im.papelTapa}\n`;
    if (im.papelInterior)  msg += `*Papel interior:* ${im.papelInterior}\n`;
    if (im.caracteristicaLaminado) msg += `*Características laminado:* ${im.caracteristicaLaminado}${im.caracteristicaSolotapa ? ` · ${im.caracteristicaSolotapa}` : ''}\n`;
    // terminaciones
    const terms = [];
    if (im.tienePerforacion) terms.push(`Perforación${im.ubicacionPerforacion ? ` (${im.ubicacionPerforacion})` : ''}`);
    if (im.tienePuntasRedondeadas) terms.push(`Puntas redondeadas${im.especPuntasRedondeadas ? ` (${im.especPuntasRedondeadas})` : ''}`);
    if (im.terminacion) terms.push(im.terminacion);
    if (terms.length) msg += `*Terminación:* ${terms.join(' · ')}\n`;
    if (cant) msg += `*Cantidad:* ${cant} unidades\n`;
    if (S.extra.tieneArte !== null) msg += `*Arte:* ${S.extra.tieneArte ? 'Lo mando adjunto en este chat' : 'Necesito diseño'}\n`;
    if (S.extra.fecha) {
      const d = new Date(S.extra.fecha+'T12:00:00');
      msg += `*Lo necesito para:* ${d.toLocaleDateString('es-AR',{day:'numeric',month:'long'})}\n`;
    }
    if (S.extra.observaciones) msg += `*Observaciones:* ${S.extra.observaciones}\n`;
    if (S.extra.nombre) msg += `\n_Soy ${S.extra.nombre}_`;
    return msg;
  }
  return '¡Hola! Quiero consultar un trabajo de impresión.';
}

function renderHeader(stepLabel, showBack=true) {

    <div class="hdr-top">
      ${showBack ? '<button class="back" id="backBtn">&#8249;</button>' : ''}

}

function renderAreas() {

  c.className = 'content fade';
  c.innerHTML = `
    <span class="q-icon">🗂️</span>
    <div class="q-title">¿En qué área entramos?</div>

  `;
  app.appendChild(c);

  AREAS.forEach(a => {
    const btn = document.createElement('button');
    btn.className = 'supercat-btn';
    btn.innerHTML = `
      <img class="sc-img" src="${a.img}" alt="${a.name}" loading="lazy" onerror="this.style.background='#B8DFF0';this.removeAttribute('src')">
      <div class="sc-label">
        <span class="sc-name">${a.icon} ${a.name}</span>

    `;
    btn.onclick = () => selectArea(a);
    grid.appendChild(btn);
  });
}

function selectArea(a) {
  S.area = a.id;
  S.history.push('areas');
  if (a.id === 'centro') {
    S.producto = 'hojas_sueltas';
    S.hs = { color:null, tamaño:null, papel:null, cantidad:null, cantCustom:'' };
    S.screen = 'centro_color';
  } else if (a.id === 'granformato') {
    S.producto = null;
    S.gf = { subrubro:null, papel:null, cobertura:null, tamaño:null, ancho:'', alto:'', terminacion:null, soporte:null, color:null, cantidad:null, cantCustom:'' };
    S.screen = 'gf_subrubro';
  } else if (a.id === 'etiquetas') {
    S.producto = null;
    S.et = { subrubro:null, papel:null, color:null, tamaño:null, ancho:'', alto:'', laminado:null, terminacion:null, cantidad:null, cantCustom:'' };
    S.screen = 'et_subrubro';
  } else if (a.id === 'fotolibros') {
    S.producto = null;
    S.fl = { tapa:null, tamaño:null, paginas:null, paginasExtra:'', cantidad:null, cantCustom:'' };
    S.screen = 'fl_tapa';
  } else if (a.id === 'imprenta') {
    S.producto = null;
    S.im = { producto:null, papel:null, color:null, laminado:null, terminacion:null, cantidad:null, cantCustom:'', tienePerforacion:null, ubicacionPerforacion:'', tienePuntasRedondeadas:null, especPuntasRedondeadas:'', especOtraTerminacion:'', esPromoViernes:false, solapa:null, colorSolapa:null, tipoPlegado:null, tamaño:null, tipoPapeleria:null, tipoSobre:null, intercalado:null, numeracionInicio:'', encuadernacion:null, tieneTroquelado:null, tipoEncuadernado:null, tipoEncuadernadoOtro:'', colorImp:null, cantPaginas:'', papelTapa:null, papelInterior:null, caracteristicaLaminado:null, caracteristicaSolotapa:null };
    S.screen = 'im_producto';
  } else {
    S.screen = 'otros';
  }
  render();
}

  renderHeader('1 de 4');
  const c = document.createElement('div');
  c.className = 'content fade';
  c.innerHTML = `
    <span class="q-icon">🖨️</span>
    <div class="q-title">¿Cómo va la impresión?</div>
    <div class="q-sub">Elegí el esquema de color</div>
    <div class="opts" id="optsList"></div>
  `;
  app.appendChild(c);
  const list = c.querySelector('#optsList');
  TINTAS_HS.forEach(t => {
    const info = TINTAS_INFO[t];
    const btn = document.createElement('button');
    btn.className = 'opt-btn' + (S.hs.color === t ? ' sel' : '');
    btn.innerHTML = `
      <div class="opt-txt">
        ${info.label}
        <span class="opt-code">${info.code}</span>
      </div>
      <div class="chk">${S.hs.color === t ? '✓' : ''}</div>

    btn.onclick = () => {
      S.hs.color = t;
      setTimeout(() => { S.history.push('centro_color'); S.screen='centro_tamaño'; render(); }, 180);
    };
    list.appendChild(btn);
  });
  // No sé
  const noSeBtn = document.createElement('button');
  noSeBtn.className = 'opt-btn' + (S.hs.color === 'No sé / Consultar' ? ' sel' : '');

  noSeBtn.onclick = () => {
    S.hs.color = 'No sé / Consultar';
    setTimeout(() => { S.history.push('centro_color'); S.screen='centro_tamaño'; render(); }, 180);
  };
  list.appendChild(noSeBtn);
}

// Etiqueta corta para mostrar en la lista de ítems del resumen
function buildItemLabel() {
  if (S.area === 'centro')   return `Hojas sueltas · ${S.hs.tamaño||''} · ${S.hs.papel||''}`;
  if (S.area === 'gran_formato') return `${S.gf.subrubro||'Gran formato'} · ${S.gf.papel||''}`;
  if (S.area === 'fotolibros')   return `Fotolibro · tapa ${S.fl.tapa||''}`;
  if (S.area === 'etiquetas')    return `Etiquetas ${S.et.subrubro||''} · ${S.et.papel||''}`;
  if (S.area === 'imprenta') {
    const prod = IM_PRODUCTOS.find(p=>p.id===S.im.producto);
    return prod ? prod.name : 'Imprenta Digital';
  }
  return 'Producto';
}

// Extrae el bloque de detalle del ítem actual (sin datos extra como nombre/fecha)
function buildCurrentItemMsg() {
  // Llamar a la función buildWA correspondiente y extraer solo la parte del producto
  const full = buildWAMessage();
  // Remover el bloque de pie (nombre, fecha, arte, obs) para guardarlo limpio
  const lines = full.split('\n');
  const cutIdx = lines.findIndex(l => l.startsWith('*Arte:') || l.startsWith('*Fecha') || l.startsWith('*Observaciones') || l.startsWith('_Soy'));
  return (cutIdx > 0 ? lines.slice(0, cutIdx) : lines).join('\n').trim();
}

function gfUvTerminacionGroup() {
  const s = S.gf.soporte;
  if (!s) return [];
  if (s === 'Lona') return GF_UV_TERMINACIONES.lona;
  if (s === 'Imán') return GF_UV_TERMINACIONES.iman;
  if (s.startsWith('Vinilo')) return [...GF_UV_TERMINACIONES.vinilo, ...GF_UV_TERMINACIONES.montado];
  if (s === 'Papel Mural') return GF_UV_TERMINACIONES.lona;
  return GF_UV_TERMINACIONES.vinilo;
}

function mkOptBtn(label, desc, selected, onClick) {
  const btn = document.createElement('button');
  btn.className = 'opt-btn' + (selected ? ' sel' : '');
  btn.innerHTML = `
    <div class="opt-txt">
      ${label}
      ${desc ? `<span class="opt-sub">${desc}</span>` : ''}
    </div>
    <div class="chk">${selected ? '✓' : ''}</div>
  `;
  btn.onclick = onClick;
  return btn;
}

function gfNext(fromScreen, nextScreen) {
  S.history.push(fromScreen);
  S.screen = nextScreen;
  render();
}

function gfAutoNext(fromScreen, nextScreen) {
  setTimeout(() => gfNext(fromScreen, nextScreen), 180);
}

      </div>

      <button class="btn-primary" onclick="confirmarDimsLaminas()" style="margin-top:8px">Confirmar medida →</button>
    </div>
  `;
  app.appendChild(c);
  const list = c.querySelector('#optsList');

  const TAMAÑOS_STD = [
    { v:'A2', d:'42 × 59,4 cm' },
    { v:'A1', d:'59,4 × 84,1 cm' },
    { v:'A0', d:'84,1 × 118,9 cm' }
  ];
  const dimsDiv = c.querySelector('#dims-custom');

  TAMAÑOS_STD.forEach(t => {
    list.appendChild(mkOptBtn(t.v, t.d, S.gf.tamaño===t.v && S.gf.tamaño!=='otra', () => {
      S.gf.tamaño = t.v; S.gf.ancho = ''; S.gf.alto = '';
      dimsDiv.style.display = 'none';
      gfAutoNext('gf_tamaño', 'gf_terminacion');
    }));
  });

  const otraBtn = mkOptBtn('Otra medida', 'Ingresá el ancho y alto en cm', S.gf.tamaño==='otra', () => {
    S.gf.tamaño = 'otra';
    list.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('sel'));
    otraBtn.classList.add('sel');
    otraBtn.querySelector('.chk').textContent = '✓';
    dimsDiv.style.display = 'block';
    document.getElementById('inp-ancho').focus();
  });

  if (S.gf.tamaño === 'otra') dimsDiv.style.display = 'block';

  c.querySelector('#inp-ancho').oninput = e => S.gf.ancho = e.target.value;
  c.querySelector('#inp-alto').oninput  = e => S.gf.alto  = e.target.value;
}

function confirmarDimsLaminas() {
  const a = document.getElementById('inp-ancho').value;
  const h = document.getElementById('inp-alto').value;

  S.gf.ancho = a; S.gf.alto = h; S.gf.tamaño = 'otra';
  gfNext('gf_tamaño', 'gf_terminacion');
}

  c.innerHTML = `
    <span class="q-icon">🔢</span>

      <button class="btn-confirm" onclick="confirmarCantGf()">OK</button>

    </button>
  `;
  app.appendChild(c);
  const cantidades = ['1','2','5','10','25','50','100','250','500'];
  const grid = c.querySelector('#qtyGrid');
  cantidades.forEach(q => {
    const btn = document.createElement('button');
    btn.className = 'qty-btn' + (S.gf.cantidad === q ? ' sel' : '');
    btn.textContent = Number(q).toLocaleString('es-AR');
    btn.onclick = () => {
      S.gf.cantidad = q; S.gf.cantCustom = '';
      grid.querySelectorAll('.qty-btn').forEach(b => b.classList.remove('sel'));
      btn.classList.add('sel');
      document.getElementById('inp-cant-libre').value = '';
      document.getElementById('btn-sig-gf').disabled = false;
    };
    grid.appendChild(btn);
  });
  c.querySelector('#inp-cant-libre').oninput = e => {
    if (e.target.value) {
      S.gf.cantidad = 'otra'; S.gf.cantCustom = e.target.value;
      grid.querySelectorAll('.qty-btn').forEach(b => b.classList.remove('sel'));
      document.getElementById('btn-sig-gf').disabled = false;
    }
  };
}

  return S.et.subrubro === 'papel' && S.et.papel === 'Ilustración 350 gr.';

function etTotalPasos() {
  const sub = S.et.subrubro;
  if (sub === 'iman')         return 4; // color + tamaño + terminacion + cantidad

  if (sub === 'papel')        return etTieneLaminado() ? 5 : 4;
  return 4;

  return etTieneLaminado() ? 'et_laminado' : 'et_terminacion';

// ─── pantalla WA message builder ─────────────────────────────────────────────
function buildImWA() {
  const im=S.im; const cant=im.cantidad==='otra'?im.cantCustom:im.cantidad;
  const prod=IM_PRODUCTOS.find(p=>p.id===im.producto);
  const prefix=buildItemsPrefix();
  const itemLabel=S.items.length>0?`${S.items.length+1}️⃣ `:'';
  let msg=`¡Hola! Quiero consultar precio para:\n\n`;
  msg+=prefix;
  msg+=`${itemLabel}*Producto:* ${prod?.name||im.producto}\n`;
  if(im.esPromoViernes) msg+=`*Modalidad:* Promo Viernes\n`;
  if(im.tipoPlegado)    msg+=`*Tipo:* ${im.tipoPlegado}\n`;
  if(im.tipoPapeleria)  msg+=`*Tipo:* ${im.tipoPapeleria==='hojas'?'Hojas membretadas':'Sobres'}\n`;
  if(im.tipoSobre)      msg+=`*Sobre:* ${im.tipoSobre}\n`;
  if(im.papel)          msg+=`*Papel:* ${im.papel}\n`;
  if(im.tamaño)         msg+=`*Tamaño:* ${im.tamaño}\n`;
  if(im.color)          msg+=`*Color:* ${im.color}\n`;
  if(im.colorImp)       msg+=`*Color:* ${im.colorImp}\n`;
  if(im.solapa!==null&&im.solapa!==undefined) msg+=`*Solapa:* ${im.solapa?'Con solapa':'Sin solapa'}\n`;
  if(im.colorSolapa)    msg+=`*Solapa impresión:* ${im.colorSolapa==='blanca'?'Blanca sin imprimir':'Solapa impresa'}\n`;
  if(im.laminado)       msg+=`*Laminado:* ${im.laminado}\n`;
  if(im.intercalado)    msg+=`*Intercalado:* ${im.intercalado}\n`;
  if(im.numeracionInicio) msg+=`*Numeración desde:* ${im.numeracionInicio}\n`;
  if(im.encuadernacion) msg+=`*Encuadernación:* ${im.encuadernacion}\n`;
  if(im.tieneTroquelado!==null&&im.tieneTroquelado!==undefined){const troqL={'no':'Sin troquelado','solo_original':'Solo original','todos':'Original + copias'};msg+=`*Troquelado:* ${typeof im.tieneTroquelado==='string'?(troqL[im.tieneTroquelado]||im.tieneTroquelado):(im.tieneTroquelado?'Sí':'No')}\n`;}
  if(im.tipoEncuadernado) msg+=`*Encuadernado:* ${im.tipoEncuadernado}${im.tipoEncuadernadoOtro?` (${im.tipoEncuadernadoOtro})`:''}\n`;
  if(im.tipoEncuadernadoInterior) msg+=`*Enc. interior:* ${im.tipoEncuadernadoInterior}\n`;
  if(im.cantPaginas)    msg+=`*${im.tipoEncuadernado==='Libretas anilladas'?'Hojas':'Páginas'}:* ${im.cantPaginas}\n`;
  if(im.papelTapa)      msg+=`*Papel tapa:* ${im.papelTapa}\n`;
  if(im.laminado)       msg+=`*Laminado tapas:* ${im.laminado}\n`;
  if(im.colorInterior)  msg+=`*Color interior:* ${im.colorInterior}\n`;
  if(im.papelInterior)  msg+=`*Papel interior:* ${im.papelInterior}\n`;
  if(im.laminadoInterior) msg+=`*Laminado interior:* ${im.laminadoInterior}\n`;
  if(im.caracteristicaLaminado) msg+=`*Laminado en:* ${im.caracteristicaLaminado}${im.caracteristicaSolotapa?` · ${im.caracteristicaSolotapa}`:''}\n`;
  const terms=[];
  if(im.tienePerforacion) terms.push(`Perforación${im.ubicacionPerforacion?` (${im.ubicacionPerforacion})`:''}`);
  if(im.tienePuntasRedondeadas) terms.push(`Puntas redondeadas${im.especPuntasRedondeadas?` (${im.especPuntasRedondeadas})`:''}`);
  if(terms.length) msg+=`*Terminaciones:* ${terms.join(' · ')}\n`;
  if(cant) msg+=`*Cantidad:* ${cant} unidades\n`;
  if(S.extra.tieneArte!==null) msg+=`*Arte:* ${S.extra.tieneArte?'Lo mando adjunto':'Necesito diseño'}\n`;
  if(S.extra.fecha){const d=new Date(S.extra.fecha+'T12:00:00');msg+=`*Para:* ${d.toLocaleDateString('es-AR',{day:'numeric',month:'long'})}\n`;}
  if(S.extra.nombre) msg+=`\n_Soy ${S.extra.nombre}_`;
  return msg;
}

// Regla de laminado: Opalina nunca · Ilus se lamina desde 250gr
// Excepciones: Anillado tapas y Libretas tapas → Cartón forrado también se lamina
function edPuedeLaminarTapa(papel) {
  if(!papel) return false;
  if(papel==='Cartón forrado') return true; // anillado y libretas
  if(papel.includes('Opalina')) return false;
  const gr=parseInt(papel.match(/(\d+)\s*gr/)?.[1]||'0');
  return gr>=250;
}
function edPuedeLaminarInterior(papel) {
  if(!papel||papel.includes('Opalina')) return false;
  const gr=parseInt(papel.match(/(\d+)\s*gr/)?.[1]||'0');
  return gr>=250;
}

  let titulo, infoPrincipal, extra='', inputAttr='min="2"', nextPag;

    extra='<br>Máximo: <strong>90 hojas</strong>.';
    inputAttr='min="1" max="90"';

  } else {
    titulo='¿Cuántas páginas interiores?';
    infoPrincipal='📖 <strong>Página ≠ Hoja:</strong> una hoja tiene 2 páginas (frente y dorso). Ejemplo: 8 hojas = 16 páginas.';
    if(esRevista) extra='<br><strong>La cantidad debe ser múltiplo de 4</strong> (ej: 8, 12, 16, 20…).';

    <div class="free-input-row">

  c.querySelector('#inp-pags').oninput=e=>{im.cantPaginas=e.target.value;const b=document.getElementById('btn-sig');if(b)b.disabled=!e.target.value;};
}
function confirmarPaginas(tipo, nextOverride){
  const v=document.getElementById('inp-pags')?.value; if(!v)return;
  const enc=S.im.tipoEncuadernado;
  if(enc==='Revista'&&Number(v)%4!==0){alert('Revista: la cantidad de páginas debe ser múltiplo de 4 (ej: 8, 12, 16…)');return;}
  if(enc==='Libretas anilladas'&&Number(v)>90){alert('Las libretas admiten un máximo de 90 hojas.');return;}
  S.im.cantPaginas=v; imGo(nextOverride||`im_${tipo}_papel_tapa`);
}

function renderImMenus_papel_tapa()    { renderImMenuPapelTapa('menus'); }
function renderImEditorial_papel_tapa(){ renderImMenuPapelTapa('editorial'); }
function renderImMenuPapelTapa(tipo) {
  const enc=S.im.tipoEncuadernado;
  const esHojas   = enc==='Hojas sueltas';
  renderHeader(tipo==='editorial'?'Libros y Revistas':'Menús');
  const c=document.createElement('div'); c.className='content fade';
  c.innerHTML=`<span class="q-icon">📄</span>
    <div class="q-title">${esHojas?'Tipo de papel':'Papel para las tapas'}</div>
    <div class="opts" id="optsList"></div>`;
  app.appendChild(c);
  const list=c.querySelector('#optsList');

  let papeles;
  if(enc==='Revista'){
    papeles=['Opalina 150 gr.','Ilustración 170 gr.','Ilustración 250 gr.','Ilustración 350 gr.'];
  } else if(enc==='Anillado'){
    papeles=['Ilustración 250 gr.','Ilustración 350 gr.','Cartón forrado'];
  } else if(enc==='Libretas anilladas'){
    papeles=['Ilustración 350 gr.','Cartón forrado'];
  } else if(esHojas){
    papeles=(IM_PAPELES_MENUS||[]).filter(p=>!['Ilustración 350 gr.'].includes(p));
  } else {
    papeles=[...IM_PAPELES_MENUS||[]];
  }

  papeles.forEach(p=>{
    const desc = p==='Cartón forrado' ? 'Tapa de cartón forrado. Muy resistente.' : (PAPEL_DESC[p]||'');
    const puedeL = edPuedeLaminarTapa(p);
    // Después de elegir papel tapa: si puede laminar → laminado; si no → intro_interior o color (hojas)
    let next;
    if(esHojas)            next = im_menuNextLaminado(tipo);
    else if(puedeL)        next = `im_${tipo}_laminado`;
    else                   next = `im_${tipo}_intro_interior`;
    list.appendChild(mkOptBtn(p, desc, S.im.papelTapa===p, ()=>{
      S.im.papelTapa=p; S.im.laminado=null; S.im.laminadoInterior=null;
      imAuto(next);
    }));
  });
}

function renderImMenus_papel_interior()    { renderImMenuPapelInterior('menus'); }

function renderImMenuPapelInterior(tipo) {

    const enc2=S.im.tipoEncuadernadoInterior;
    if(enc2==='Binder abrochado'){
      papeles=['Opalina 150 gr.','Ilustración 170 gr.'];
    } else {
      // Termo engomado
      papeles=['Opalina 90 gr.','Ilustración 115 gr.','Opalina 150 gr.','Ilustración 170 gr.'];
    }
  } else if(enc==='Revista'){
    papeles=['Opalina 90 gr.','Ilustración 115 gr.','Opalina 150 gr.','Ilustración 170 gr.','Ilustración 250 gr.'];
  } else if(enc==='Anillado'){
    papeles=['Opalina 90 gr.','Ilustración 115 gr.','Opalina 150 gr.','Ilustración 170 gr.','Ilustración 250 gr.','Ilustración 350 gr.'];
  } else if(enc==='Libretas anilladas'){
    papeles=['Resma 80 gr.','Nat 80 gr.'];

  papeles.forEach(p=>{
    const puedeL = edPuedeLaminarInterior(p);
    // Para Binder abrochado: Ilus 170 aclarar "hasta 15 hojas"
    const desc = (enc==='Libro' && S.im.tipoEncuadernadoInterior==='Binder abrochado' && p==='Ilustración 170 gr.')
      ? 'Hasta 15 hojas.'
      : (PAPEL_DESC[p]||'');
    // Libro: interior nunca lamina → cantidad. Libretas: sin laminado → cantidad.
    // Resto: si puede laminar → laminado_interior; si no → cantidad
    let next;

function renderImMenus_laminado()    { renderImMenuLaminado('menus'); }

function renderImMenuLaminado(tipo) {
  const enc=S.im.tipoEncuadernado;
  const esHojas  = enc==='Hojas sueltas';
  const esLibreta= enc==='Libretas anilladas';
  const titulo   = esHojas ? 'Laminado' : 'Laminado de tapas';
  // Después del laminado de tapas: Anillado/Revista/Libro/Libretas → intro_interior; resto → cantidad
  const nextAfter= ['Anillado','Revista','Libro','Libretas anilladas'].includes(enc)
    ? `im_${tipo}_intro_interior`
    : `im_${tipo}_cantidad`;

  let opciones = IM_LAMINADOS.map(l=>{
    // Libretas: sin la opción "Sin laminado" NO — corrección: incluir Sin laminado también (pedido final)
    return {key:'laminado',v:l.v,label:l.v,desc:l.d,next:nextAfter};
  });
  // Hojas sueltas + Opalina 90gr: agregar Plastificado
  if(esHojas && S.im.papelTapa==='Opalina 90 gr.'){
    opciones.push({key:'laminado',v:'Plastificado',label:'Plastificado',
      desc:'Solo disponible en Opalina 90 gr.',next:`im_${tipo}_cantidad`});
  }
  renderImStep('✨',titulo,null,opciones);
}

      <strong>Pasos:</strong> Cantidad de hojas (máx 90) → Color → Papel (sin laminado)
    </div>
    <button class="btn-primary" onclick="imGo('im_libretas_paginas')">OK →</button>`;
  app.appendChild(c);
}
function renderImLibretasPaginas() {
  renderHeader('Libretas anilladas');
  const c=document.createElement('div'); c.className='content fade'; const im=S.im;
  c.innerHTML=`<span class="q-icon">📖</span>
    <div class="q-title">¿Cuántas hojas?</div>
    <div class="info-box" style="margin-bottom:16px">
      📖 <strong>Hoja ≠ Página:</strong> una hoja tiene 2 páginas (frente y dorso).<br>
      Máximo: <strong>90 hojas</strong>.
    </div>
    <div class="free-input-row">
      <input type="number" id="inp-pags-lib" placeholder="Nº de hojas" min="1" max="90" value="${im.cantPaginas}">
      <button class="btn-confirm" onclick="confirmarHojasLibretas()">OK</button>
    </div>
    <button class="btn-primary" id="btn-sig-lib" style="margin-top:24px"
      onclick="confirmarHojasLibretas()" ${!im.cantPaginas?'disabled':''}>Siguiente →</button>`;
  app.appendChild(c);
  c.querySelector('#inp-pags-lib').oninput=e=>{
    im.cantPaginas=e.target.value;
    const b=document.getElementById('btn-sig-lib'); if(b) b.disabled=!e.target.value;
  };
}
function confirmarHojasLibretas(){
  const v=document.getElementById('inp-pags-lib')?.value; if(!v) return;
  if(Number(v)>90){alert('Las libretas admiten un máximo de 90 hojas.');return;}
  S.im.cantPaginas=v; imGo('im_libretas_color');
}
function renderImLibretasColor() {
  renderImStep('🖨️','¿Cómo va el interior?',null,[
    {key:'colorInterior',v:'0/0 · En blanco',label:'En blanco (0/0)',  desc:'Sin impresión. Solo papel.',  next:'im_libretas_papel_interior'},
    {key:'colorInterior',v:'1/1',            label:'1/1 · Ambas caras',desc:'Impresión B&N en ambas caras.',next:'im_libretas_papel_interior'},
  ]);
}
function renderImLibretasPapelInterior() {
  renderImStep('📄','Papel del interior',null,[
    {key:'papelInterior',v:'Resma 80 gr.',label:'Resma 80 gr.',desc:'Papel estándar de impresora.',next:'im_libretas_cantidad'},
    {key:'papelInterior',v:'Nat 80 gr.', label:'Nat 80 gr.', desc:PAPEL_DESC['Nat 80 gr.']||'', next:'im_libretas_cantidad'},
  ]);
}
function renderImLibretasCantidad() {
  renderHeader('Libretas anilladas');
  const c=document.createElement('div'); c.className='content fade'; const im=S.im;
  c.innerHTML=`<span class="q-icon">🔢</span>
    <div class="q-title">¿Cuántas libretas?</div>
    <div class="qty-grid" id="qtyGrid-lib"></div>
    <div class="free-input-row" style="margin-top:8px">
      <input type="number" id="inp-cant-lib" placeholder="Otra cantidad…" min="1"
        value="${im.cantidad&&im.cantidad!=='otra'?'':(im.cantCustom||'')}">
      <button class="btn-confirm" onclick="confirmarCantLibretas()">OK</button>
    </div>
    <button class="btn-primary" id="btn-sig-lib2" style="margin-top:24px"
      onclick="irAExtraIm()" ${!im.cantidad?'disabled':''}>Siguiente →</button>`;
  app.appendChild(c);
  const grid=c.querySelector('#qtyGrid-lib');
  ['10','25','50','100','250','500'].forEach(q=>{
    const btn=document.createElement('button');
    btn.className='qty-btn'+(im.cantidad===q?' sel':'');
    btn.textContent=Number(q).toLocaleString('es-AR');
    btn.onclick=()=>{
      im.cantidad=q; im.cantCustom='';
      grid.querySelectorAll('.qty-btn').forEach(b=>b.classList.remove('sel'));
      btn.classList.add('sel');
      const inp=document.getElementById('inp-cant-lib'); if(inp) inp.value='';
      const sig=document.getElementById('btn-sig-lib2'); if(sig) sig.disabled=false;
    };
    grid.appendChild(btn);
  });
  c.querySelector('#inp-cant-lib').oninput=e=>{
    if(e.target.value){
      im.cantidad='otra'; im.cantCustom=e.target.value;
      grid.querySelectorAll('.qty-btn').forEach(b=>b.classList.remove('sel'));
      const sig=document.getElementById('btn-sig-lib2'); if(sig) sig.disabled=false;
    }
  };
}
function confirmarCantLibretas(){
  const v=document.getElementById('inp-cant-lib')?.value;
  if(v){S.im.cantidad='otra';S.im.cantCustom=v;irAExtraIm();}
}


render();
</script>
</body>
</html>
